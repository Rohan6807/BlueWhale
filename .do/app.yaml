name: cardiolens-ai
region: nyc
services:
  - name: backend
    environment_slug: python
    github:
      branch: main
      deploy_on_push: true
      repo_clone_url: https://github.com/cardiolens/cardiolens-ai.git
    source_dir: backend
    build_command: pip install -r requirements.txt
    run_command: alembic upgrade head && python -m app.data.seed_data && uvicorn app.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/v1/health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: cardiolens-do-secure-secret-key-prod-9832749
      - key: DEMO_MODE
        scope: RUN_TIME
        value: "true"
      - key: BACKEND_CORS_ORIGINS
        scope: RUN_TIME
        value: "*"
      - key: GEMMA_API_BASE_URL
        scope: RUN_TIME
        value: ""
      - key: GEMMA_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: GEMMA_MODEL_NAME
        scope: RUN_TIME
        value: "google/gemma-4-9b-it"

static_sites:
  - name: frontend
    github:
      branch: main
      deploy_on_push: true
      repo_clone_url: https://github.com/cardiolens/cardiolens-ai.git
    source_dir: frontend
    build_command: npm install && npm run build
    output_dir: dist
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
    cluster_name: cardiolens-postgres-cluster
    db_name: cardiolens_db
    db_user: cardiolens_user
