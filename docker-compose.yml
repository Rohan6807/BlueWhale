version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cardiolens-postgres
    restart: always
    environment:
      POSTGRES_USER: cardiolens_user
      POSTGRES_PASSWORD: cardiolens_secure_password_2026
      POSTGRES_DB: cardiolens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardiolens_user -d cardiolens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardiolens-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cardiolens_user:cardiolens_secure_password_2026@db:5432/cardiolens_db
      SECRET_KEY: cardiolens-prod-jwt-secret-key-replace-in-do-3984279
      DEMO_MODE: "true"
      GEMMA_API_BASE_URL: "${GEMMA_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}"
      GEMMA_API_KEY: "${GEMMA_API_KEY}"
      GEMMA_MODEL_NAME: "${GEMMA_MODEL_NAME:-gemma-4-26b-a4b-it}"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardiolens-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
